<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212121"><title>MyGPT</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand">✳ <b>MyGPT</b><button id="close" class="mobile">×</button></div><button id="newChat" class="new">＋ New chat</button><p class="label">Recent</p><div id="history" class="history"></div><div class="account"><span class="avatar">M</span><span>MyGPT User<small>Personal</small></span></div></aside>
<main><header><div><button id="open" class="mobile">☰</button><b class="model">MyGPT <span>⌄</span></b></div><div><button id="theme" class="plain">◐</button><a href="https://platform.openai.com/api-keys" target="_blank">API settings ↗</a></div></header>
<section id="chat"><div id="welcome"><div class="logo">✳</div><h1>What can I help with?</h1><div class="suggestions"><button data-prompt="Explain a difficult topic in simple terms.">✧ Explain something</button><button data-prompt="Help me write a professional email.">✎ Write something</button><button data-prompt="Give me creative ideas for a new project.">⌘ Brainstorm ideas</button><button data-prompt="Help me debug this code:">⌁ Help with code</button></div></div><div id="messages"></div></section>
<footer><form id="form"><textarea id="prompt" rows="1" placeholder="Message MyGPT"></textarea><div class="controls"><span>＋ <small>Ask anything</small></span><button id="send" type="submit">↑</button></div></form><p>MyGPT can make mistakes. Check important information.</p></footer></main></div><script src="/app.js"></script></body></html>
