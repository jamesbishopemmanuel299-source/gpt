<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#212121"><meta name="description" content="MyGPT — your AI assistant"><title>MyGPT</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="side-top"><a class="brand" href="/" aria-label="MyGPT home"><span class="brand-mark">✳</span><b>MyGPT</b></a><button class="icon-btn mobile-only" id="closeSidebar" aria-label="Close menu">×</button></div>
<button class="new-chat" id="newChat"><span>＋</span> New chat</button>
<div class="side-section"><div class="side-label">Your chats</div><div id="history" class="history"></div></div>
<div class="side-bottom"><button class="profile" id="profileBtn"><span class="avatar">M</span><span class="profile-copy"><b>MyGPT</b><small>Personal workspace</small></span><span class="more">···</span></button></div></aside>
<div class="sidebar-scrim" id="scrim"></div>
<main class="main-panel"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-only" id="openSidebar" aria-label="Open menu">☰</button><button class="model-picker" id="modelPicker">MyGPT <span class="chevron">⌄</span></button><span class="model-note">AI assistant</span></div><div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button><button class="share-btn" id="shareBtn">Share</button></div></header>
<section class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="welcome-mark">✳</div><h1>What can I help with?</h1><p class="welcome-sub">Ask anything, explore ideas, or get something done.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain a difficult topic in simple terms."><span>✧</span><b>Learn something</b><small>Understand a new topic</small></button><button class="suggestion" data-prompt="Help me write a clear, professional email."><span>✎</span><b>Write anything</b><small>Draft, edit, or improve text</small></button><button class="suggestion" data-prompt="Give me creative ideas for a new project."><span>⌘</span><b>Brainstorm</b><small>Explore fresh ideas</small></button><button class="suggestion" data-prompt="Help me write or debug some code."><span>⌁</span><b>Code</b><small>Build and troubleshoot</small></button></div></div><div id="messages" class="messages" aria-live="polite"></div></section>
<footer class="composer-area"><form id="form" class="composer"><textarea id="prompt" rows="1" placeholder="Message MyGPT" aria-label="Message MyGPT"></textarea><div class="composer-bottom"><div class="composer-tools"><label class="attach-btn" title="Attach a text file">＋<input id="fileInput" type="file" accept=".txt,.md,.csv,.json,.js,.html,.css,.py" hidden></label><span class="tool-hint">Add context</span></div><div class="composer-right"><span class="enter-hint">↵ to send</span><button id="send" class="send-btn" type="submit" aria-label="Send message">↑</button></div></div></form><p class="disclaimer">MyGPT can make mistakes. Verify important information.</p></footer></main></div><div id="toast" class="toast" role="status"></div><script src="/app.js"></script></body></html>
